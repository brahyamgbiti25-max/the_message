





spring.application.name=the-message

# Database configuration (supports environment variables for Docker with local defaults)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/the_message?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:brahyam12345}

# JPA & Hibernate properties
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.format_sql=true
spring.jpa.show-sql=true

# Server Port
server.port=8081

# Mail Service Configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=garciablasbrahyam@gmail.com
spring.mail.password=gfjufextqwsqyttv
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Frontend Integration & Security
app.frontend.url=http://localhost:4200
jwt.secret=TheTalentIsn'tRequestTogrowLikeDeveloper

# Spring Security Debugging Logs
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.web.FilterChainProxy=DEBUG
logging.level.org.springframework.security.authorization=DEBUG










